 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-heading">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <header id="main-heading">
    <img src="https://via.placeholder.com/80" alt="Budget Tracker Logo" width="80">
    <h1>My Budget Tracker</h1>
    <p>Track your income and expenses in one place.</p>
</header>


<section>
    <h2>Budgeting Tips</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="Budgeting Tips Video"
 frameborder="0">

 <details>
    <summary>How to use this tracker</summary>
    <p>Enter your expense name, amount, and category, then click the Add Expense button to record your expense.</p>
</details>

    </iframe>
</section>


        <section class="add-expense-section">
    <h2>Add Expense</h2>

    <form id="expenseForm">
        <input type="text" id="expense-name" placeholder="Expense Name" required>

        <input type="number" id="expense-amount" placeholder="Amount" required>

        <select id="expense-category" required>
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>

        <button type="button">Add Expense</button>
    </form>
</section>
    

</body>
</html>
